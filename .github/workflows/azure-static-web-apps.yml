# Builds the static export and ships it, with the contact Function in api/, to the
# Azure Static Web Apps resource swa-linqcode-site (Free plan).
name: Deploy to Azure Static Web Apps

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-web-apps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm

      - name: Build the static export
        run: |
          npm ci
          npm run build
          test -f out/index.html
          test -f out/staticwebapp.config.json

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: out
          api_location: api
          skip_app_build: true
